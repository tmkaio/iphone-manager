name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the GitHub Release (empty: only build and upload the installer as a workflow artifact)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            installer/constraints.txt

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match app/__init__.py version $v" }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          # 6.5+ for the [Files] download/extractarchive flags (ffmpeg); the runner image may ship an older one
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ok = (Test-Path $iscc) -and ([version](Get-Item $iscc).VersionInfo.ProductVersion -ge [version]"6.5")
          if (-not $ok) {
            choco upgrade innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Python (Get-Command python).Source -Iscc $env:ISCC

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneManager-Setup
          path: dist/iPhoneManager-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          name: iPhone Manager ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          files: dist/iPhoneManager-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
