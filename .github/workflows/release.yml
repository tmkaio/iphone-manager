name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the GitHub Release (empty: only build and upload the installers as workflow artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            installer/constraints.txt

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match app/__init__.py version $v" }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          # 6.5+ for the [Files] download/extractarchive flags (ffmpeg); the runner image may ship an older one
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ok = (Test-Path $iscc) -and ([version](Get-Item $iscc).VersionInfo.ProductVersion -ge [version]"6.5")
          if (-not $ok) {
            choco upgrade innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Python (Get-Command python).Source -Iscc $env:ISCC

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/iPhoneManager-Setup-*.exe
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        include:
          # Apple silicon only: cryptography (pymobiledevice3) no longer ships Intel Mac wheels
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate" >&2; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the .dmg
        run: bash installer/build-unix.sh

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: for dmg in dist/*.dmg; do bash installer/notarize.sh "$dmg"; done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04     # x86_64; the oldest glibc the AppImage then runs on is 2.35
          - runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build the AppImage
        run: |
          sudo apt-get install -y --no-install-recommends libusb-1.0-0
          bash installer/build-unix.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          name: iPhone Manager ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          files: |
            dist/iPhoneManager-Setup-*.exe
            dist/*.dmg
            dist/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
